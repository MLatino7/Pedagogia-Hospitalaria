name: Deploy to GitHub Pages
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: GITHUB_PAGES=true npm run build
      - name: Configure GitHub Pages
        id: configure_pages
        uses: actions/configure-pages@v5
      - name: Explain Pages setup if configuration fails
        if: failure() && steps.configure_pages.outcome == 'failure'
        run: |
          echo "GitHub Pages no está habilitado para este repositorio."
          echo "Abre Settings > Pages, selecciona GitHub Actions como Source y guarda el cambio."
          echo "Después vuelve a ejecutar este workflow desde Actions > Deploy to GitHub Pages > Run workflow."
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
